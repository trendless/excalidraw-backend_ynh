#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "excalidraw-backend"
name = "Excalidraw Backend"
description.en = "Virtual whiteboard for sketching hand-drawn like diagrams"
description.fr = "Tableau blanc collaboratif virtuel qui vous permet d'esquisser facilement des diagrammes"

version = "2025.8.2~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://excalidraw.com"
demo = "https://excalidraw.com"
code = "https://github.com/jitsi/excalidraw-backend"
fund = "https://opencollective.com/excalidraw"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "1500M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/jitsi/excalidraw-backend/archive/refs/tags/2025.8.2.tar.gz"
    sha256 = "f620b30a02ac43d4d8ff2c60cb1a57fcde3d3f59c9ff207e1e0d488eecbc2b8c"
    autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.nodejs]
    version = "22"
    